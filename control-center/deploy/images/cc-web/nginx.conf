server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the management plane is reachable from the browser. /internal/ and /agent/
    # fall through to the SPA and therefore 404 as API calls: the control plane is not
    # exposed here on purpose (see the NetworkPolicy in deploy/k3d).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://cc-mgmt:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
