apiVersion: v1
kind: Service
metadata:
  name: cc-pg
  namespace: cc-train0
spec:
  selector:
    app: cc-pg
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cc-pg
  namespace: cc-train0
spec:
  serviceName: cc-pg
  replicas: 1
  selector:
    matchLabels:
      app: cc-pg
  template:
    metadata:
      labels:
        app: cc-pg
    spec:
      securityContext:
        # postgres:17-bookworm ships uid/gid 999 (the alpine variant uses 70).
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: cc-pg:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            # Keep the data directory in a subdirectory of the volume: the entrypoint then
            # owns a fresh directory instead of finding a volume root it did not create.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: pg-superuser-password
            - name: CC_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: migrator-password
            - name: CC_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: app-password
            - name: CC_AUDIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: audit-password
            - name: CC_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: ro-password
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
          args:
            - -c
            - log_min_duration_statement=200ms
            - -c
            - log_statement=ddl
            - -c
            - max_connections=100
            - -c
            - timezone=UTC
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d mgmt -q"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -q"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
