apiVersion: v1
kind: Service
metadata:
  name: cc-control
  namespace: cc-train0
spec:
  selector:
    app: cc-control
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Agent control plane (gRPC + mTLS). Only cc.role=control serves this port; the
    # `allow-control-grpc-from-agents` NetworkPolicy is the only ingress path to it.
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-control
  namespace: cc-train0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cc-control
  template:
    metadata:
      labels:
        app: cc-control
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cc-java:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: CC_ROLE
              value: control
            - name: CC_DB_URL
              value: jdbc:postgresql://cc-pg:5432/control
            - name: CC_DB_SCHEMA
              value: control
            - name: CC_DB_USER
              value: cc_app
            - name: CC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: app-password
            - name: CC_MIGRATOR_USER
              value: cc_migrator
            - name: CC_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: migrator-password
            # PEM material for the gRPC server (mTLS). The secret is created out of
            # band with `kubectl create secret generic control-plane-tls
            # --from-file=server.crt --from-file=server.key --from-file=ca.crt` and is
            # mounted read-only; these paths match the application defaults.
            - name: CC_TLS_CERT
              value: /etc/cc/tls/server.crt
            - name: CC_TLS_KEY
              value: /etc/cc/tls/server.key
            - name: CC_TLS_CA
              value: /etc/cc/tls/ca.crt
          volumeMounts:
            - name: control-plane-tls
              mountPath: /etc/cc/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      volumes:
        - name: control-plane-tls
          secret:
            secretName: control-plane-tls
