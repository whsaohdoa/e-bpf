# Dev-only credentials. Nothing here is a secret: Train 0 runs on a laptop cluster.
# A real deployment injects these from an external secret store and rotates the migrator
# password away from the app password (they are separate roles precisely so that this is
# possible without touching migrations).
apiVersion: v1
kind: Secret
metadata:
  name: cc-secrets
  namespace: cc-train0
type: Opaque
stringData:
  pg-superuser-password: postgres
  migrator-password: cc_migrator
  app-password: cc_app
  audit-password: cc_audit
  ro-password: cc_ro
