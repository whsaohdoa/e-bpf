apiVersion: v1
kind: Service
metadata:
  name: cc-mgmt
  namespace: cc-train0
spec:
  selector:
    app: cc-mgmt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-mgmt
  namespace: cc-train0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cc-mgmt
  template:
    metadata:
      labels:
        app: cc-mgmt
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cc-java:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CC_ROLE
              value: mgmt
            - name: CC_DB_URL
              value: jdbc:postgresql://cc-pg:5432/mgmt
            - name: CC_DB_SCHEMA
              value: mgmt
            - name: CC_DB_USER
              value: cc_app
            - name: CC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: app-password
            - name: CC_MIGRATOR_USER
              value: cc_migrator
            - name: CC_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: migrator-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
