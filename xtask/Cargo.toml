[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# No registry dependencies on purpose: the entry point only shells out to
# `cargo`, so it can run before (and without) the probe dependencies being
# fetchable. `probe-testkit` is a local path dependency and stays dependency
# free itself, which keeps that property intact.
[dependencies]
probe-testkit = { path = "../testkit" }
