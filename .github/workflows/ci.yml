name: CI

# Three jobs produce the status, one job (`gate`) decides it:
#   changes — which half of the repo this push/PR actually touched (paths-filter)
#   fast    — formatting, clippy and the three host test layers (L0 unit, L1 CLI
#             contract, L2 in-process pipeline). No privileges, no kernel, under
#             two minutes after the cache is warm.
#   bpf     — the eBPF object compiles for `bpfel-unknown-none` with the pinned
#             nightly toolchain. This is the only job that needs LLVM and
#             bpf-linker for a build that is not a side effect of the host build.
#
# Why `changes` and `gate` instead of workflow-level `paths:`: the repository now
# holds two independently runnable projects (`probe/` here, `control-center/` in
# its own workflow). A `paths:` filter on the trigger would never report a status
# for a PR that misses it, which leaves a required check pending forever. So the
# workflow always starts, the expensive jobs skip themselves, and `gate` always
# runs and turns "skipped" into a green status.
#
# The e2e gate (privileged container, real kernel) stays on `main` and arrives
# with the L3 driver in stage S3, see verification/TEST-PLAN.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # `dorny/paths-filter` lists a PR's changed files through the REST API.
  pull-requests: read

concurrency:
  group: probe-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The runner has no direct route to some upstream mirrors.
  UBUNTU_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/ubuntu

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bpf: ${{ steps.filter.outputs.bpf }}
    steps:
      # Full history so the filter can diff a `push` range locally as well.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `rust` is "anything the host build/tests read"; `bpf` is the narrower set
      # that can change the object: the data-path crate, the shared ABI, the
      # pinned toolchain and the build script that drives it.
      # The only third-party action in this file besides the GitHub ones. If the
      # supply-chain policy changes, pin it to a commit SHA.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.cargo/**'
              - '.config/**'
              - 'probe/**'
              - 'probe-common/**'
              - 'probe-ebpf/**'
              - 'testkit/**'
              - 'xtask/**'
              - 'scripts/ci/**'
              - 'Dockerfile.ci'
              - '.github/workflows/ci.yml'
            bpf:
              - 'probe-ebpf/**'
              - 'probe-common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'xtask/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'

  fast:
    name: fast (fmt, clippy, L0-L2)
    needs: changes
    # `workflow_dispatch` means "run everything": a manual run has no diff to
    # filter on, so treat it as if every path changed.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and rustup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'scripts/ci/install-toolchain.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install toolchain
        run: bash scripts/ci/install-toolchain.sh

      - name: Toolchain versions
        run: |
          rustc -Vv
          cargo -V
          cargo nextest --version
          cargo llvm-cov --version
          bpf-linker --version

      - name: Format
        run: bash scripts/ci/run.sh bash scripts/ci/fmt.sh

      - name: Clippy
        # `--workspace` includes `xtask`, which is not a default member.
        # `probe-ebpf` is excluded: it only builds for `bpfel-unknown-none`, and
        # `cargo xtask bpf` is where that target is checked.
        run: bash scripts/ci/run.sh cargo clippy --workspace --exclude probe-ebpf --all-targets -- -D warnings

      # L0 + L1 + L2 in one process tree; `xtask` picks nextest when present and
      # falls back to `cargo test` otherwise. The L2 layer is the in-process
      # pipeline, so no layer here needs sudo, a kernel or a network interface.
      - name: Test layers
        run: bash scripts/ci/run.sh cargo xtask test --layer all

      - name: Documentation tests
        run: bash scripts/ci/run.sh cargo test --doc --workspace

      # Report only for now: `main.rs`/`app.rs` are excluded and the baseline has
      # not been measured on the new split yet. S3/S5 set COVERAGE_MIN_LINES once
      # the number is stable, which turns this step into the gate the plan asks
      # for (`main.rs` >= 60%).
      - name: Coverage
        run: bash scripts/ci/run.sh bash scripts/ci/coverage.sh

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/nextest/ci/junit*.xml
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/lcov.info
          if-no-files-found: warn

  bpf:
    name: bpf object
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.bpf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and rustup
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            target
          key: ${{ runner.os }}-bpf-${{ hashFiles('**/Cargo.lock', 'scripts/ci/install-toolchain.sh') }}
          restore-keys: |
            ${{ runner.os }}-bpf-

      # This job never runs nextest or llvm-cov, so it does not pay for their
      # `cargo install` on a cold cache.
      - name: Install toolchain
        env:
          INSTALL_TEST_TOOLING: '0'
        run: bash scripts/ci/install-toolchain.sh

      # Same command a developer runs locally: `cargo xtask bpf`. The eBPF crate
      # needs `-Z build-std=core` and the nightly-only `bpfel-unknown-none`
      # target, neither of which the host build in `fast` exercises on its own.
      - name: Build eBPF object
        run: bash scripts/ci/run.sh cargo xtask bpf

  # Always runs, so a PR that touches neither Rust nor the data path still gets a
  # definite status on the required check. A skipped dependency counts as green
  # only because that is exactly what the paths filter decided above.
  gate:
    name: gate
    if: always()
    needs: [changes, fast, bpf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarise job results
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          BPF: ${{ needs.bpf.result }}
        run: |
          echo "changes=$CHANGES fast=$FAST bpf=$BPF"
          status=0
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job did not succeed ($CHANGES); the path filter is unreliable"
            status=1
          fi
          for job in fast bpf; do
            case "$job" in
              fast) result="$FAST" ;;
              bpf) result="$BPF" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$job did not succeed ($result)"
              status=1
            fi
          done
          exit "$status"
