[workspace]
resolver = "2"
members = [
    "agent",
    "probe",
    "probe-common",
    "probe-ebpf",
    "testkit",
    "xtask",
]
# `xtask` stays out of the default members: `cargo build`/`cargo test` should
# only cover the shipped crates, and `cargo xtask` names its package explicitly.
default-members = ["probe", "probe-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
prost = { version = "0.14.6", default-features = false, features = ["std", "derive"] }
prost-build = { version = "0.14.6", default-features = false }
prost-types = { version = "0.14.6", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
# Only `agent`'s `mock` feature (the fake control plane and its `control-mock`
# binary) needs JSON, and only behind that feature.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false }
# `tls-ring` is the 0.13+ spelling of the 0.12 `tls` feature: it pulls rustls
# with the `ring` crypto provider (no aws-lc C toolchain needed in the dev image).
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "router", "server", "transport", "tls-ring"] }
tonic-prost = { version = "0.14.9", default-features = false }
# Code generation for `proto/control.proto`; `transport` emits both the client
# and the server half (the mock control plane needs the server trait).
tonic-prost-build = { version = "0.14.9", default-features = false, features = ["transport"] }
which = { version = "6.0.0", default-features = false }

[profile.release.package.probe-ebpf]
debug = 2
codegen-units = 1
strip = false
